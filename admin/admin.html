<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel Administrativo | José Cuesta</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">
    <div>
      <span class="admin-badge">ADMIN</span>
      <h1>Panel administrativo</h1>
      <p>Gestión de publicaciones del blog</p>
    </div>

    <div class="header-actions">

      <a href="../pages/" class="view-blog">
        Ver blog →
      </a>

      <button id="logout-btn" class="logout-btn">
        Cerrar sesión
      </button>

    </div>
  </header>


  <main class="admin-container">

    <!-- Estadísticas -->
    <section class="stats">
      <div class="stat-card">
        <span>Publicaciones</span>
        <strong id="total-posts">0</strong>
      </div>

      <div class="stat-card">
        <span>Estado</span>
        <strong id="firebase-status">Conectando...</strong>
      </div>
    </section>

    <!-- FORMULARIO NUEVA PUBLICACIÓN -->
    <section id="post-form-section" class="post-form-section hidden">

      <div class="section-header">
        <div>
          <span class="section-label">NUEVO CONTENIDO</span>
          <h2 id="form-title">Crear publicación</h2>
        </div>

        <button id="cancel-post-btn" class="secondary-btn">
          Cancelar
        </button>
      </div>


      <form id="post-form">

        <div class="form-group">
          <label for="title">Título</label>

          <input type="text" id="title" placeholder="Escribe el título de la publicación" required>
        </div>


        <div class="form-row">

          <div class="form-group">
            <label for="category">Categoría</label>

            <input type="text" id="category" placeholder="Ej: Territorio" required>
          </div>


          <div class="form-group">
            <label for="author">Autor</label>

            <input type="text" id="author" value="Equipo José Cuesta" required>
          </div>

        </div>


        <div class="form-group">

          <label for="image">
            Ruta de la imagen
          </label>

          <input type="text" id="image" placeholder="../assets/img/blog1.jpg" required>

          <small>
            Ejemplo: ../assets/img/blog1.jpg
          </small>

        </div>


        <div class="form-group">

          <label for="content">
            Contenido
          </label>

          <textarea id="content" rows="12" placeholder="Escribe aquí el contenido completo del artículo..."
            required></textarea>

        </div>


        <div id="form-message" class="form-message"></div>


        <button type="submit" class="primary-btn publish-btn">
          Publicar artículo
        </button>

      </form>

    </section>

    <!-- Publicaciones -->
    <section class="posts-section">

      <div class="section-header">
        <div>
          <span class="section-label">CONTENIDO</span>
          <h2>Publicaciones existentes</h2>
        </div>

        <button id="new-post-btn" class="primary-btn">
          + Nueva publicación
        </button>
      </div>


      <div id="posts-container" class="posts-container">

        <div class="loading">
          Cargando publicaciones...
        </div>

      </div>

    </section>

  </main>


  <script type="module" src="admin.js"></script>

</body>

</html>
