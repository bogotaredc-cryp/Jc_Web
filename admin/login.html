<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso administrativo | José Cuesta</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <span class="admin-badge">
                ADMIN
            </span>

            <h1>
                Panel administrativo
            </h1>

            <p class="login-subtitle">
                Ingresa tus credenciales para gestionar el blog.
            </p>


            <form id="login-form">

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password" id="password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>

                </div>


                <div id="login-message" class="form-message"></div>


                <button type="submit" id="login-btn" class="primary-btn login-btn">
                    Iniciar sesión
                </button>

            </form>

        </div>

    </main>


    <script type="module" src="login.js"></script>

</body>

</html>
